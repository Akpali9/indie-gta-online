name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build Notice
        run: echo "Unity APK build requires Unity Cloud Build or self-hosted runner"

      - name: Upload Artifact Placeholder
        run: echo "No Unity installed on GitHub runner"
